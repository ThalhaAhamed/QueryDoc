name: RAG Evaluation Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  evaluate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install -r requirements.txt --system
          uv pip install rank-bm25 tiktoken ragas pytest sentence-transformers --system

      - name: Run Evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python eval/evaluate.py
